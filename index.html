<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToKa Fitness | BMI Calculator</title>
	<link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>ToKa Fitness</h1>
        <p>Your fitness journey starts here.</p>
    </header>

    <main>
        <h2>BMI Calculator</h2>
        <p>Enter your height and weight below to calculate your BMI.</p>

        <form id="bmiForm">

            <label for="height">Height (cm):</label>
            <input
                type="number"
                id="height"
                name="height"
                min="1"
                step="any"
                placeholder="Enter your height in cm"
                required
            >

            <br><br>

            <label for="weight">Weight (kg):</label>
            <input
                type="number"
                id="weight"
                name="weight"
                min="1"
                step="any"
                placeholder="Enter your weight in kg"
                required
            >

            <br><br>

            <button type="submit">Calculate BMI</button>

        </form>

        <section id="bmiResult">
            <!-- The JavaScript file will display the BMI result here. -->
        </section>
    </main>

    <footer>
        <p>&copy; 2026 ToKa Fitness. All rights reserved.</p>
    </footer>

    <!-- Connect the external JavaScript file -->
    <script src="bmiCalculation.js"></script>

</body>
</html>
